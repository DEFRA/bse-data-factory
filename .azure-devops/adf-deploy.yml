name: $(Build.BuildId)

trigger:
  branches:
    include:
      - main

pr: none
pool:
  name: DEFRA-COMMON-WINDOWS-SSV3
variables:
- name: DataFactoryName
  value: '$(environment)$(project)$(nc-function-infrastructure)$(nc_datafactory)$(subscriptionNumber)$(regionNumber)01'

- name: ResourceGroupName
  value: '$(environment)$(project)$(nc-function-infrastructure)$(nc_resourcegroup)$(subscriptionNumber)$(regionNumber)01'

stages:
- stage: DEV
  displayName: Deploy DEV
  variables:
  - name: environment
    value: DEV
  jobs:
  - deployment: DeployADFDEV
    displayName: Deploy ADF to DEV
    environment: DEV
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzurePowerShell@5
            displayName: Deploy ADF Artifacts
            inputs:
              azureSubscription: AZR-BSE-DEV1
              ScriptType: FilePath
              ScriptPath: scripts/Deploy-AdfObjects.ps1
              ScriptArguments: >
                -ResourceGroupName "$(ResourceGroupName)"
                -DataFactoryName "$(DataFactoryName)"
              azurePowerShellVersion: LatestVersion

- stage: TST
  displayName: Deploy TST
  dependsOn: DEV
  variables:
  - name: environment
    value: TST
  jobs:
  - deployment: DeployADFTST
    displayName: Deploy ADF to TST
    environment: TST
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzurePowerShell@5
            displayName: Deploy ADF Artifacts
            inputs:
              azureSubscription: AZR-BSE-TST1
              ScriptType: FilePath
              ScriptPath: scripts/Deploy-AdfObjects.ps1
              ScriptArguments: >
                -ResourceGroupName "$(ResourceGroupName)"
                -DataFactoryName "$(DataFactoryName)"
              azurePowerShellVersion: LatestVersion
- stage: PRE
  displayName: Deploy PRE
  dependsOn: TST
  variables:
  - name: environment
    value: PRE
  jobs:
  - deployment: DeployADFPRE
    displayName: Deploy ADF to PRE
    environment: PRE
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzurePowerShell@5
            displayName: Deploy ADF Artifacts
            inputs:
              azureSubscription: AZR-BSE-PRE1
              ScriptType: FilePath
              ScriptPath: scripts/Deploy-AdfObjects.ps1
              ScriptArguments: >
                -ResourceGroupName "$(ResourceGroupName)"
                -DataFactoryName "$(DataFactoryName)"
              azurePowerShellVersion: LatestVersion