name: $(Build.BuildId)

trigger:
  branches:
    include:
      - main

pr: none

pool:
  name: DEFRA-COMMON-WINDOWS-SSV3

stages:
- stage: DEV
  displayName: Deploy DEV
  jobs:
  - deployment: DeployADFDEV
    environment: DEV
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzurePowerShell@5
            displayName: Deploy ADF Artifacts
            inputs:
              azureSubscription: AZR-BSE-DEV1
              ScriptType: FilePath
              ScriptPath: scripts/Deploy-AdfArtifacts.ps1
              ScriptArguments: >
                -ResourceGroupName "DEVBSEINFRARG240101"
                -DataFactoryName "DEVBSEDATAFACTORY240101"
              azurePowerShellVersion: LatestVersion

- stage: TST
  displayName: Deploy TST
  dependsOn: DEV
  jobs:
  - deployment: DeployADFTST
    environment: TST
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzurePowerShell@5
            displayName: Deploy ADF Artifacts
            inputs:
              azureSubscription: AZR-BSE-TST1
              ScriptType: FilePath
              ScriptPath: scripts/Deploy-AdfArtifacts.ps1
              ScriptArguments: >
                -ResourceGroupName "TSTBSEINFRARG240101"
                -DataFactoryName "TSTBSEDATAFACTORY240101"
              azurePowerShellVersion: LatestVersion

- stage: PRE
  displayName: Deploy PRE
  dependsOn: TST
  jobs:
  - deployment: DeployADFPRE
    environment: PRE
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzurePowerShell@5
            displayName: Deploy ADF Artifacts

            inputs:
              azureSubscription: AZR-BSE-PRE1
              ScriptType: FilePath
              ScriptPath: scripts/Deploy-AdfArtifacts.ps1
              ScriptArguments: >
                -ResourceGroupName "PREBSEINFRARG240101"
                -DataFactoryName "PREBSEDATAFACTORY240101"
              azurePowerShellVersion: LatestVersion
