name: $(Build.BuildId)

trigger:
  branches:
    include:
      - main

pr: none

pool:
  name: DEFRA-COMMON-WINDOWS-SSV3

parameters:
- name: deployToDev
  displayName: Deploy to DEV
  type: boolean
  default: true

- name: deployToTest
  displayName: Deploy to TST
  type: boolean
  default: false

- name: deployToPreProd
  displayName: Deploy to PRE
  type: boolean
  default: false

- name: deployToProd
  displayName: Deploy to PRD
  type: boolean
  default: false

variables:

- name: project
  value: 'BSE'
- name: ncFunctionInfrastructure
  value: 'INF'
- name: ncResourceGroup
  value: 'RG'
- name: ncDataFactory
  value: 'ADF'
- name: ncKeyVault
  value: 'KV'
- name: ncSqlServer
  value: 'SQ'
- name: subscriptionNumber
  value: '1'
- name: regionNumber
  value: '4'
- name: instanceNumber
  value: '01'

stages:

- stage: DEV
  displayName: Deploy DEV
  dependsOn: []
  condition: >-
    and(
      eq('${{ parameters.deployToDev }}', true),
      eq(variables['Build.SourceBranchName'], 'main')
    )
  variables:
  - name: resourceGroupName
    value: DEV${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncResourceGroup }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  - name: dataFactoryName
    value: DEV${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncDataFactory }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  - name: keyVaultName
    value: DEV${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncKeyVault }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  - name: rdsServerName
    value: 'tses.data.dev1.dev.cerespfm.cloud'
  - name: serviceConnection
    value: AZR-${{ variables.project }}-DEV${{ variables.subscriptionNumber }}
  - name: sqlServerName
    value: DEV${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncSqlServer }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  jobs:
  - deployment: DeployADFDEV
    displayName: Deploy ADF to DEV
    environment: DEV
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzurePowerShell@5
            displayName: Deploy ADF Artifacts
            inputs:
              azureSubscription: ${{ variables.serviceConnection }}
              ScriptType: FilePath
              ScriptPath: scripts/Deploy-AdfObjects.ps1
              ScriptArguments: >
                -ResourceGroupName "$(resourceGroupName)"
                -DataFactoryName "$(dataFactoryName)"
                -KeyVaultName "$(keyVaultName)"
                -RdsServerName "$(rdsServerName)"
                -SqlServerName "$(sqlServerName)"
              azurePowerShellVersion: LatestVersion

- stage: TST
  displayName: Deploy TST
  dependsOn: DEV
  condition: >-
    and(
      in(dependencies.DEV.result, 'Succeeded', 'Skipped'),
      eq('${{ parameters.deployToTest }}', true),
      eq(variables['Build.SourceBranchName'], 'develop')
    )
  variables:
  - name: resourceGroupName
    value: TST${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncResourceGroup }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  - name: dataFactoryName
    value: TST${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncDataFactory }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  - name: keyVaultName
    value: TST${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncKeyVault }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  - name: rdsServerName
    value: 'tses.data.dev1.dev.cerespfm.cloud'
  - name: serviceConnection
    value: AZR-${{ variables.project }}-TST${{ variables.subscriptionNumber }}
  - name: sqlServerName
    value: TST${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncSqlServer }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  jobs:
  - deployment: DeployADFTST
    displayName: Deploy ADF to TST
    environment: TST
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzurePowerShell@5
            displayName: Deploy ADF Artifacts
            inputs:
              azureSubscription: ${{ variables.serviceConnection }}
              ScriptType: FilePath
              ScriptPath: scripts/Deploy-AdfObjects.ps1
              ScriptArguments: >
                -ResourceGroupName "$(resourceGroupName)"
                -DataFactoryName "$(dataFactoryName)"
                -KeyVaultName "$(keyVaultName)"
                -RdsServerName "$(rdsServerName)"
                -SqlServerName "$(sqlServerName)"
              azurePowerShellVersion: LatestVersion

- stage: PRE
  displayName: Deploy PRE
  dependsOn: TST
  condition: >-
    and(
      in(dependencies.TST.result, 'Succeeded', 'Skipped'),
      eq('${{ parameters.deployToPreProd }}', true),
      eq(variables['Build.SourceBranchName'], 'main')
    )
  variables:
  - name: resourceGroupName
    value: PRE${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncResourceGroup }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  - name: dataFactoryName
    value: PRE${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncDataFactory }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  - name: keyVaultName
    value: PRE${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncKeyVault }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  - name: rdsServerName
    value: 'tses.data.prp1.prp.cerespfm.cloud'
  - name: serviceConnection
    value: AZR-${{ variables.project }}-PRE${{ variables.subscriptionNumber }}
  - name: sqlServerName
    value: PRE${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncSqlServer }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  jobs:
  - deployment: DeployADFPRE
    displayName: Deploy ADF to PRE
    environment: PRE
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzurePowerShell@5
            displayName: Deploy ADF Artifacts
            inputs:
              azureSubscription: ${{ variables.serviceConnection }}
              ScriptType: FilePath
              ScriptPath: scripts/Deploy-AdfObjects.ps1
              ScriptArguments: >
                -ResourceGroupName "$(resourceGroupName)"
                -DataFactoryName "$(dataFactoryName)"
                -KeyVaultName "$(keyVaultName)"
                -RdsServerName "$(rdsServerName)"
                -SqlServerName "$(sqlServerName)"
              azurePowerShellVersion: LatestVersion

- stage: PRD
  displayName: Deploy PRD
  dependsOn: PRE
  condition: >-
    and(
      eq(dependencies.PRE.result, 'Succeeded'),
      eq('${{ parameters.deployToProd }}', true),
      eq(variables['Build.SourceBranchName'], 'main')
    )
  variables:
  - name: resourceGroupName
    value: PRD${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncResourceGroup }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  - name: dataFactoryName
    value: PRD${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncDataFactory }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  - name: keyVaultName
    value: PRD${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncKeyVault }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  - name: rdsServerName
    value: 'tses.data.prd1.prd.cerespfm.cloud'
  - name: serviceConnection
    value: AZR-${{ variables.project }}-PRD${{ variables.subscriptionNumber }}
  - name: sqlServerName
    value: PRD${{ variables.project }}${{ variables.ncFunctionInfrastructure }}${{ variables.ncSqlServer }}${{ variables.subscriptionNumber }}${{ variables.regionNumber }}${{ variables.instanceNumber }}
  jobs:
  - deployment: DeployADFPRD
    displayName: Deploy ADF to PRD
    environment: PRD
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzurePowerShell@5
            displayName: Deploy ADF Artifacts
            inputs:
              azureSubscription: ${{ variables.serviceConnection }}
              ScriptType: FilePath
              ScriptPath: scripts/Deploy-AdfObjects.ps1
              ScriptArguments: >
                -ResourceGroupName "$(resourceGroupName)"
                -DataFactoryName "$(dataFactoryName)"
                -KeyVaultName "$(keyVaultName)"
                -RdsServerName "$(rdsServerName)"
                -SqlServerName "$(sqlServerName)"
              azurePowerShellVersion: LatestVersion
