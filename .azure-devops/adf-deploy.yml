name: $(Build.BuildId)

trigger:
  branches:
    include:
      - main

pr: none

pool:
  name: DEFRA-COMMON-WINDOWS-SSV3

variables:

  devResourceGroupName: 'DEVBSEINFRG1401'
  devDataFactoryName: 'DEVBSEINFADF1401'

  tstResourceGroupName: 'TSTBSEINFRG1401'
  tstDataFactoryName: 'TSTBSEINFADF1401'

  preResourceGroupName: 'PREBSEINFRG1401'
  preDataFactoryName: 'PREBSEINFADF1401'

stages:

- stage: DEV
  displayName: Deploy DEV
  jobs:
  - deployment: DeployADFDEV
    displayName: Deploy ADF to DEV
    environment: DEV
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzurePowerShell@5
            displayName: Deploy ADF Artifacts
            inputs:
              azureSubscription: AZR-BSE-DEV1
              ScriptType: FilePath
              ScriptPath: scripts/Deploy-AdfObjects.ps1
              ScriptArguments: >
                -ResourceGroupName "$(devResourceGroupName)"
                -DataFactoryName "$(devDataFactoryName)"
              azurePowerShellVersion: LatestVersion

- stage: TST
  displayName: Deploy TST
  dependsOn: DEV
  jobs:
  - deployment: DeployADFTST
    displayName: Deploy ADF to TST
    environment: TST
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzurePowerShell@5
            displayName: Deploy ADF Artifacts
            inputs:
              azureSubscription: AZR-BSE-TST1
              ScriptType: FilePath
              ScriptPath: scripts/Deploy-AdfObjects.ps1
              ScriptArguments: >
                -ResourceGroupName "$(tstResourceGroupName)"
                -DataFactoryName "$(tstDataFactoryName)"
              azurePowerShellVersion: LatestVersion

- stage: PRE
  displayName: Deploy PRE
  dependsOn: TST
  jobs:
  - deployment: DeployADFPRE
    displayName: Deploy ADF to PRE
    environment: PRE
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzurePowerShell@5
            displayName: Deploy ADF Artifacts
            inputs:
              azureSubscription: AZR-BSE-PRE1
              ScriptType: FilePath
              ScriptPath: scripts/Deploy-AdfObjects.ps1
              ScriptArguments: >
                -ResourceGroupName "$(preResourceGroupName)"
                -DataFactoryName "$(preDataFactoryName)"
              azurePowerShellVersion: LatestVersion
